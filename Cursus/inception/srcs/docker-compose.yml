#version: '3.8'
services:
  mariadb:
    image: mariadb
    build: requirements/mariadb
    container_name: mariadb
    env_file:
      - .env
    secrets:
      - mariadb_db_password
      - mariadb_db_root_password
    volumes:
      - database:/var/lib/mysql
    restart: always
    networks:
      - inception
    expose:
      - "3306"

  wordpress:
    image: wordpress
    build: requirements/wordpress
    container_name: wordpress
    depends_on:
      - mariadb
    env_file:
      - .env
    secrets:
      - wordpress_admin_user
      - wordpress_admin_password
      - wordpress_db_password
      - wordpress_user_password
    volumes:
      - wordpress:/var/www/html
    restart: always
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
    networks: 
      - inception
    expose:
      - "9000"

  nginx:
    image: nginx
    container_name: nginx
    build: requirements/nginx
    depends_on:
      - wordpress
    env_file:
      - .env
    volumes:
      - wordpress:/var/www/html
    ports:
      - "443:443"
    restart: always
    networks:
      - inception

networks:
  inception:
    driver: bridge

volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dbohoyo-/data/mysql

  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dbohoyo-/data/wordpress

secrets:
  mariadb_db_password:
    file: ../secrets/mariadb/db_password.txt
  mariadb_db_root_password:
    file: ../secrets/mariadb/db_root_password.txt
  wordpress_admin_user:
    file: ../secrets/wordpress/admin_user.txt
  wordpress_admin_password:
    file: ../secrets/wordpress/admin_password.txt
  wordpress_db_password:
    file: ../secrets/wordpress/db_password.txt
  wordpress_user_password:
    file: ../secrets/wordpress/wordpress_user_password.txt

